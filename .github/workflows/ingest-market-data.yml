name: Ingest Market Data (OpenBB & Global Feeds)

on:
  schedule:
    # Mon-Fri at 21:30 UTC (post-US cash close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '60'
      dry_run:
        description: 'Dry run (fetch data without writing to Supabase)'
        type: boolean
        required: false
        default: false
      metric:
        description: 'Specific metric ID to ingest (optional, e.g. DXY_INDEX)'
        required: false
        default: ''

concurrency:
  group: ingest-market-data
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest Cross-Asset Telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run Market Data Ingestion
        id: run_ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_DB_PASSWORD || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          ARGS=()
          if [ -n "${{ inputs.days }}" ]; then
            ARGS+=(--days "${{ inputs.days }}")
          fi
          python scripts/ingest_openbb_market_data.py "${ARGS[@]}"

      - name: Run CFTC COT Positioning Ingestion
        id: run_cftc_cot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_DB_PASSWORD || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          COT_ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            COT_ARGS+=(--dry-run)
          fi
          python scripts/ingest_cftc_cot.py "${COT_ARGS[@]}"

