name: Data Freshness Audit

# Diagnostics: pg_cron jobs, their recent runs, recent edge-function HTTP responses (pg_net),
# deployed edge functions, and per-metric freshness. The audit queries run read-only.
# Optionally triggers named edge functions now, with the same auth headers as their cron jobs.
on:
  workflow_dispatch:
    inputs:
      invoke_functions:
        description: 'Comma-separated function paths to trigger now (e.g. ingest-us-macro?task=auctions). Empty = audit only.'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Deployed edge functions (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/functions" \
            | python3 -c "import json,sys; fs=json.load(sys.stdin); print(len(fs),'functions'); [print(f\"{f['slug']:44} v{f.get('version')} {f.get('status')} updated={str(f.get('updated_at'))[:10]}\") for f in sorted(fs,key=lambda f:f['slug'])]"

      - name: Cron jobs, runs, and pg_net responses
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          ENCODED_PW=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          export PGOPTIONS='-c default_transaction_read_only=on'
          DB="postgresql://postgres.${SUPABASE_PROJECT_ID}:${ENCODED_PW}@aws-1-ap-south-1.pooler.supabase.com:5432/postgres"
          q() { echo; echo "=== $1 ==="; psql "$DB" -v ON_ERROR_STOP=1 -P pager=off -c "$2"; }

          q "cron jobs" "
            SELECT jobid, jobname, schedule, active,
                   COALESCE(substring(command from 'functions/v1/([a-z0-9-]+)'), left(regexp_replace(command, '\s+', ' ', 'g'), 70)) AS target
            FROM cron.job ORDER BY jobname;"

          q "cron runs per job (last 14 days)" "
            SELECT j.jobname,
                   count(*) FILTER (WHERE d.status = 'succeeded') AS ok,
                   count(*) FILTER (WHERE d.status <> 'succeeded') AS failed,
                   max(d.start_time)::timestamp(0) AS last_run,
                   left(max(d.return_message) FILTER (WHERE d.status <> 'succeeded'), 90) AS sample_error
            FROM cron.job j
            LEFT JOIN cron.job_run_details d ON d.jobid = j.jobid AND d.start_time > now() - interval '14 days'
            GROUP BY j.jobname ORDER BY j.jobname;"

          q "pg_net edge responses by status (last 3 days)" "
            SELECT status_code, count(*), left(max(content), 120) AS sample
            FROM net._http_response WHERE created > now() - interval '3 days'
            GROUP BY status_code ORDER BY 2 DESC;" || true

          q "latest edge-function responses (pg_net)" "
            SELECT created::timestamp(0), status_code, left(content, 400) AS body
            FROM net._http_response ORDER BY created DESC LIMIT 12;" || true

          q "metrics without a recent observation, by last write date" "
            SELECT max(last_updated_at)::date AS last_write, count(*) AS metrics, string_agg(metric_id, ', ' ORDER BY metric_id) AS ids
            FROM vw_latest_metrics WHERE staleness_flag <> 'fresh'
            GROUP BY last_updated_at::date ORDER BY 1 DESC NULLS LAST;"

      - name: Trigger requested functions
        if: ${{ inputs.invoke_functions != '' }}
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          INVOKE_FUNCTIONS: ${{ inputs.invoke_functions }}
        run: |
          set -euo pipefail
          ENCODED_PW=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          DB="postgresql://postgres.${SUPABASE_PROJECT_ID}:${ENCODED_PW}@aws-1-ap-south-1.pooler.supabase.com:5432/postgres"
          IFS=',' read -ra FNS <<< "$INVOKE_FUNCTIONS"
          for fn in "${FNS[@]}"; do
            fn="$(echo "$fn" | xargs)"
            [[ "$fn" =~ ^[a-z0-9-]+(\?[a-z0-9_=&-]+)?$ ]] || { echo "::error::invalid function path: $fn"; exit 1; }
            echo "Triggering $fn"
            # psql expands :'fn' (quoted literal) only in SQL read from stdin, not in -c.
            psql "$DB" -v ON_ERROR_STOP=1 -v fn="$fn" -t -A <<SQL
              SELECT net.http_post(
                url := 'https://' || '${SUPABASE_PROJECT_ID}' || '.supabase.co/functions/v1/' || :'fn',
                headers := jsonb_build_object(
                  'Content-Type', 'application/json',
                  'Authorization', 'Bearer ' || COALESCE(
                    (SELECT decrypted_secret FROM vault.decrypted_secrets WHERE name = 'SUPABASE_SERVICE_ROLE_KEY' LIMIT 1),
                    (SELECT decrypted_secret FROM vault.decrypted_secrets WHERE name = 'SERVICE_ROLE_KEY' LIMIT 1)),
                  'x-cron-secret', (SELECT decrypted_secret FROM vault.decrypted_secrets WHERE name = 'CRON_SECRET' LIMIT 1)),
                body := '{}'::jsonb,
                timeout_milliseconds := 150000);
          SQL
          done

      - name: Energy fabrication guard (fails on constant-restamped or seeded energy series)
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          ENCODED_PW=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          export PGOPTIONS='-c default_transaction_read_only=on'
          DB="postgresql://postgres.${SUPABASE_PROJECT_ID}:${ENCODED_PW}@aws-1-ap-south-1.pooler.supabase.com:5432/postgres"
          # Energy series whose last 5 prints are identical across 5+ days are re-stamped constants, and any
          # energy row carrying seed/fallback provenance is not an observation. Allow-list a series here only
          # if it is a published constant (e.g. a stated capacity).
          OFFENDERS=$(psql "$DB" -v ON_ERROR_STOP=1 -t -A -F ' | ' <<'SQL'
            WITH recent AS (
              SELECT o.metric_id, o.as_of_date, o.value,
                     row_number() OVER (PARTITION BY o.metric_id ORDER BY o.as_of_date DESC) AS rn
              FROM metric_observations o
              JOIN metrics m ON m.id = o.metric_id AND m.category = 'energy'
              WHERE o.as_of_date > current_date - 60
            )
            SELECT metric_id, 'constant_restamp', count(DISTINCT value)::text || ' distinct value over ' || (max(as_of_date) - min(as_of_date))::text || ' days'
            FROM recent WHERE rn <= 5
            GROUP BY metric_id
            HAVING count(*) = 5 AND count(DISTINCT value) = 1 AND max(as_of_date) - min(as_of_date) >= 4
            UNION ALL
            SELECT o.metric_id, 'seed_or_fallback', o.provenance || ' / ' || coalesce(o.source_ref, '')
            FROM metric_observations o
            JOIN metrics m ON m.id = o.metric_id AND m.category = 'energy'
            WHERE o.as_of_date > current_date - 60
              AND (o.provenance ILIKE 'seed%' OR o.provenance ILIKE 'fallback%' OR o.source_ref ILIKE 'fallback:%')
            GROUP BY o.metric_id, o.provenance, o.source_ref;
          SQL
          )
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Fabricated or constant energy series found:"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "No constant-restamped or seeded energy series in the last 60 days."
