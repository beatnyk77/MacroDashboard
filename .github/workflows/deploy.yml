name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    env:
      VITE_SUPABASE_URL: "${{ secrets.VITE_SUPABASE_URL }}"
      VITE_SUPABASE_ANON_KEY: "${{ secrets.VITE_SUPABASE_ANON_KEY }}"

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Security audit (warn — flip to blocking 2026-07-14 after 30 clean days)
      run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found high vulnerabilities — resolve before 2026-07-14 when this step becomes blocking"

    - name: Lint
      run: npm run lint -- --max-warnings 0

    - name: CI pattern guards (edge functions + migrations)
      run: node scripts/ci-guards.mjs

    - name: Type check
      run: npx tsc --noEmit

    # The scheduled ingestion workflows run these on Python 3.11; a 3.12-only syntax error
    # (backslash in an f-string) kept them failing silently from September 2026.
    - name: Use Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Compile ingestion scripts (Python 3.11)
      run: python -m py_compile scripts/ingest_openbb_market_data.py scripts/ingest_cftc_cot.py scripts/backfill_gold_history.py

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: 2.115.0

    - name: Schema drift check
      run: |
        set -euo pipefail
        GEN_ERR=$(mktemp)
        if ! supabase gen types typescript --project-id "${SUPABASE_PROJECT_ID}" > src/types/database.types.ts 2>"$GEN_ERR"; then
          echo "::error::supabase gen types failed"
          cat "$GEN_ERR"
          exit 1
        fi
        if [ ! -s src/types/database.types.ts ]; then
          echo "::error::Generated types file is empty"
          cat "$GEN_ERR"
          exit 1
        fi
        # PostgrestVersion is server metadata Supabase can change without any schema change;
        # ignore lines that differ only in it so platform upgrades don't fail CI.
        git diff --exit-code -I 'PostgrestVersion' src/types/database.types.ts || (
          echo "DB schema drift detected — regenerate types and commit:"
          echo "  supabase gen types typescript --project-id <PROJECT_ID> > src/types/database.types.ts"
          git diff --stat src/types/database.types.ts
          exit 1
        )
      env:
        SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
        SUPABASE_PROJECT_ID: "${{ secrets.SUPABASE_PROJECT_ID }}"

    - name: Test
      run: npm test

    - name: Build
      run: npx vite build
