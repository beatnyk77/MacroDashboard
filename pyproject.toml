[project]
name = "macrodashboard-market-engine"
version = "0.1.0"
description = "Market Transmission & Breadth Layer using finvizfinance for MacroDashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "finvizfinance>=1.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
